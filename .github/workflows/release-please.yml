name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # RELEASE_PLEASE_TOKEN is optional. Without it the action falls back to
      # GITHUB_TOKEN, which works — but GitHub deliberately does not run
      # workflows for events raised by GITHUB_TOKEN, so CI will not run on the
      # release PR and its required checks stay pending. See docs/workflow.md.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarise
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "Released ${{ steps.release.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
